name: cm

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node build/bundle.mjs
      - run: git diff --exit-code -- bin/cm bin/cm.sha256
      - run: npm run test:cli
      - run: npm run test:behavior
      - run: npm run test:e2e
      - run: npm run test:tddb
      - name: bundle byte-identical check
        run: |
          cp bin/cm /tmp/cm-before
          node build/bundle.mjs
          cmp bin/cm /tmp/cm-before && echo "bundle deterministic: OK"
